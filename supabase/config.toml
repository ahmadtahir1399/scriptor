# Scriptor — Supabase project configuration.
# Linked project ref: kkqswmdvlbyjubdtmcih

project_id = "kkqswmdvlbyjubdtmcih"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# A thesis can produce ~50,000 word rows; keep the implicit cap well below that
# so nobody accidentally pulls a whole document in one unpaginated request.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local-only mail catcher, so signup OTPs during development never leave the machine.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Theses are large. 50 MB covers a long dissertation with figures.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# P2 uses email OTP rather than magic links.
enable_confirmations = true
secure_password_change = true

[auth.email.template.magic_link]
subject = "Your Scriptor sign-in code"

# OAuth providers are configured in the hosted dashboard, not here — enabling
# them locally would require committing client secrets. Google is the only
# provider the app offers; see oauthProviderSchema in lib/validations/auth.ts.
[auth.external.google]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
